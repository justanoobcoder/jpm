[package]
name = "jpm"
version = "0.1.0"
description = "A package manager designed for Linux From Scratch (LFS) systems."
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
