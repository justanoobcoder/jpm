[package]
name = "jpm"
version = "0.1.0"
description = "A package manager designed for Linux From Scratch (LFS) systems."
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
colored = "3.1.1"
digest = "0.11.3"
hex = "0.4.3"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = "3.4.2"
